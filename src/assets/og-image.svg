<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#A0826D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Left accent line -->
  <rect x="80" y="160" width="4" height="300" fill="#8B7355" rx="2"/>

  <!-- Name -->
  <text x="120" y="240" font-family="'Segoe UI', Tahoma, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="2">
    Dayan Cabrera Corvo
  </text>

  <!-- Title -->
  <text x="120" y="310" font-family="'Segoe UI', Tahoma, sans-serif" font-size="36" font-weight="400" fill="#8B7355" letter-spacing="1">
    Full-Stack Developer
  </text>

  <!-- Divider -->
  <rect x="120" y="340" width="200" height="2" fill="#8B7355" opacity="0.5"/>

  <!-- Tech stack -->
  <text x="120" y="400" font-family="'Segoe UI', Tahoma, sans-serif" font-size="24" fill="#ecf0f1" opacity="0.8">
    Angular  ·  Python  ·  C#  ·  Rust  ·  FastAPI  ·  PostgreSQL
  </text>

  <!-- Tagline -->
  <text x="120" y="450" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" fill="#D8CBA7" opacity="0.7" font-style="italic">
    Programador cubano enfocado en sistemas robustos y eficientes
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
